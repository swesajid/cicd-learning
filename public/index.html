<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 480px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 24px;
  }
  h1 {
    margin: 0 0 20px;
    font-size: 22px;
    color: #1a1a1a;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  #taskInput {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  #taskInput:focus {
    border-color: #6c5ce7;
  }
  #addBtn {
    padding: 10px 16px;
    border: none;
    background: #6c5ce7;
    color: #fff;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  #addBtn:hover { background: #5b4bd1; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid #eee;
  }
  li:last-child { border-bottom: none; }
  li span {
    flex: 1;
    font-size: 14px;
    color: #333;
    word-break: break-word;
  }
  li.done span {
    text-decoration: line-through;
    color: #999;
  }
  li input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #6c5ce7;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }
  .empty {
    text-align: center;
    color: #999;
    font-size: 14px;
    padding: 20px 0;
  }
  .stats {
    margin-top: 16px;
    font-size: 12px;
    color: #999;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>My To-Do List</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="200">
      <button id="addBtn">Add</button>
    </div>
    <ul id="taskList"></ul>
    <p class="stats" id="stats"></p>
  </div>

<script>
  const STORAGE_KEY = "todos";
  const taskInput = document.getElementById("taskInput");
  const addBtn = document.getElementById("addBtn");
  const taskList = document.getElementById("taskList");
  const stats = document.getElementById("stats");

  function loadTodos() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  }

  function saveTodos(todos) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function render() {
    const todos = loadTodos();
    taskList.innerHTML = "";

    if (todos.length === 0) {
      taskList.innerHTML = '<p class="empty">No tasks yet. Add one above!</p>';
    } else {
      todos.forEach((todo) => {
        const li = document.createElement("li");
        li.className = todo.done ? "done" : "";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => toggleDone(todo.id));

        const span = document.createElement("span");
        span.textContent = todo.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "✕";
        deleteBtn.addEventListener("click", () => removeTodo(todo.id));

        li.append(checkbox, span, deleteBtn);
        taskList.appendChild(li);
      });
    }

    const doneCount = todos.filter((t) => t.done).length;
    stats.textContent = todos.length
      ? `${doneCount} of ${todos.length} done`
      : "";
  }

  function addTodo() {
    const text = taskInput.value.trim();
    if (!text) return;
    const todos = loadTodos();
    todos.push({ id: Date.now(), text, done: false });
    saveTodos(todos);
    taskInput.value = "";
    render();
  }

  function toggleDone(id) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === id);
    if (todo) todo.done = !todo.done;
    saveTodos(todos);
    render();
  }

  function removeTodo(id) {
    const todos = loadTodos().filter((t) => t.id !== id);
    saveTodos(todos);
    render();
  }

  addBtn.addEventListener("click", addTodo);
  taskInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addTodo();
  });

  render();
</script>
</body>
</html>
